<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U.L.A.M Admin Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: url("/api/placeholder/1920/1080") center/cover no-repeat;
      position: relative;
      overflow: hidden;
    }
    
    /* Overlay with gradient */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(35, 35, 50, 0.9) 0%, rgba(220, 50, 50, 0.75) 100%);
      z-index: 0;
    }

    /* Animated fitness icons background */
    .fitness-icons {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.1;
      pointer-events: none;
    }
    
    .icon {
      position: absolute; 
      color: white;
      font-size: 24px;
      opacity: 0.5;
      animation: float-icon 18s infinite linear;
    }
    
    .icon:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; content: "💪"; font-size: 36px; }
    .icon:nth-child(2) { top: 65%; left: 85%; animation-delay: 3s; content: "🏋️"; font-size: 42px; }
    .icon:nth-child(3) { top: 35%; left: 25%; animation-delay: 6s; content: "⚡"; font-size: 28px; }
    .icon:nth-child(4) { top: 80%; left: 30%; animation-delay: 9s; content: "🔥"; font-size: 38px; }
    .icon:nth-child(5) { top: 20%; left: 70%; animation-delay: 12s; content: "🏃"; font-size: 32px; }
    .icon:nth-child(6) { top: 50%; left: 50%; animation-delay: 15s; content: "🤸"; font-size: 34px; }
    
    @keyframes float-icon {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.5;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    .login-container {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 2;
      overflow: hidden;
      transform: translateY(30px);
      opacity: 0;
      animation: fadeIn 0.8s ease-out forwards;
    }
    
    /* Decorative top bar */
    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #dc3232, #ff5722);
    }
    
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      background: linear-gradient(to right, #232332, #3a3a5a);
      padding: 25px 20px;
      text-align: center;
      position: relative;
    }

    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #dc3232, #ff5722);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 24px;
      margin: 0 auto 15px;
      box-shadow: 0 5px 15px rgba(220, 50, 50, 0.4);
      position: relative;
      animation: pulse 2s infinite;
    }
    
    /* Barbell decoration on logo */
    .logo::before, .logo::after {
      content: '';
      position: absolute;
      height: 5px;
      background: white;
      border-radius: 3px;
    }
    
    .logo::before {
      width: 120%;
      left: -10%;
      top: 30%;
    }
    
    .logo::after {
      width: 120%;
      left: -10%;
      bottom: 30%;
    }
    
    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(220, 50, 50, 0.6);
      }
      70% {
        box-shadow: 0 0 0 15px rgba(220, 50, 50, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(220, 50, 50, 0);
      }
    }

    .login-header h2 {
      color: white;
      font-size: 24px;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      animation: slideDown 0.5s ease-out 0.4s forwards;
      opacity: 0;
      transform: translateY(-10px);
    }
    
    .login-header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      margin-top: 5px;
      animation: slideDown 0.5s ease-out 0.6s forwards;
      opacity: 0;
      transform: translateY(-10px);
    }
    
    @keyframes slideDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-form {
      padding: 30px;
    }

    .input-group {
      position: relative;
      margin-bottom: 25px;
      opacity: 0;
      transform: translateY(20px);
    }
    
    .input-group:nth-child(1) {
      animation: slideUp 0.5s ease-out 0.7s forwards;
    }
    
    .input-group:nth-child(2) {
      animation: slideUp 0.5s ease-out 0.9s forwards;
    }
    
    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .input-group input {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
      outline: none;
    }

    .input-group input:focus {
      border-color: #dc3232;
      box-shadow: 0 0 0 3px rgba(220, 50, 50, 0.2);
    }
    
    .input-group i {
      position: absolute;
      right: 15px;
      top: 17px;
      color: #999;
    }

    .input-group label {
      position: absolute;
      left: 15px;
      top: 15px;
      font-size: 16px;
      color: #777;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus ~ label,
    .input-group input:not(:placeholder-shown) ~ label {
      top: -10px;
      left: 10px;
      font-size: 12px;
      color: #dc3232;
      background-color: white;
      padding: 0 5px;
      font-weight: bold;
    }

    .login-button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(to right, #dc3232, #ff5722);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp 0.5s ease-out 1.1s forwards;
    }

    .login-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 20px rgba(220, 50, 50, 0.3);
    }
    
    .login-button:active {
      transform: translateY(0);
    }
    
    /* Progress bar animation for button */
    .login-button::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.5);
    }
    
    .login-button.loading::after {
      animation: progress 1.5s linear forwards;
    }
    
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    .footer-text {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #666;
      opacity: 0;
      animation: fadeIn 0.5s ease-out 1.3s forwards;
    }
    
    /* Animated strength meter */
    .strength-bars {
      display: flex;
      justify-content: center;
      margin-top: 8px;
      gap: 5px;
      height: 8px;
    }
    
    .bar {
      flex: 1;
      background: #eee;
      height: 100%;
      border-radius: 4px;
    }
    
    .bar.active {
      background: linear-gradient(to right, #dc3232, #ff5722);
      animation: grow 0.5s ease-out forwards;
    }
    
    @keyframes grow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    
    /* Button spinner */
    .button-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      position: absolute;
      left: calc(50% - 10px);
      top: calc(50% - 10px);
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading .button-text {
      visibility: hidden;
    }
    
    .loading .button-spinner {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="fitness-icons">
    <div class="icon">💪</div>
    <div class="icon">🏋️</div>
    <div class="icon">⚡</div>
    <div class="icon">🔥</div>
    <div class="icon">🏃</div>
    <div class="icon">🤸</div>
  </div>
  
  <div class="login-container">
    <div class="login-header">
      <div class="logo">U</div>
      <h2>U.L.A.M System</h2>
      <p>Admin Dashboard Access</p>
    </div>
    
    <div class="login-form">
      <form action="dashboard.html" method="GET" id="loginForm">
        <div class="input-group">
          <input type="text" id="username" required placeholder=" " />
          <label for="username">Username</label>
        </div>
        
        <div class="input-group">
          <input type="password" id="password" required placeholder=" " />
          <label for="password">Password</label>
          <div class="strength-bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
        
        <button type="submit" class="login-button" id="loginBtn">
          <span class="button-text">Power Up</span>
          <span class="button-spinner"></span>
        </button>
      </form>
      
      <p class="footer-text">© 2025 U.L.A.M Fitness Management System</p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const button = document.getElementById('loginBtn');
      button.classList.add('loading');
      
      // Simulate loading for 1.5 seconds then redirect
      setTimeout(function() {
        window.location.href = 'dashboard.html';
      }, 1500);
    });
    
    // Password strength visualization
    const passwordInput = document.getElementById('password');
    const strengthBars = document.querySelectorAll('.strength-bars .bar');
    
    passwordInput.addEventListener('input', function() {
      const length = this.value.length;
      
      // Reset bars
      strengthBars.forEach(bar => {
        bar.classList.remove('active');
      });
      
      // Activate bars based on password length
      if (length > 0) {
        strengthBars[0].classList.add('active');
      }
      if (length >= 4) {
        strengthBars[1].classList.add('active');
      }
      if (length >= 8) {
        strengthBars[2].classList.add('active');
      }
      if (length >= 12) {
        strengthBars[3].classList.add('active');
      }
    });
  </script>
</body>
</html>
